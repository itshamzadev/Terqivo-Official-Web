server {
    listen 80;
    listen [::]:80;
    server_name terqivo.com www.terqivo.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name terqivo.com www.terqivo.com;

    # SSL Certificates (Managed by aaPanel/Let's Encrypt)
    # ssl_certificate    /www/server/panel/vhost/cert/terqivo.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/terqivo.com/privkey.pem;
    
    # Root for frontend static files
    root /www/wwwroot/terqivo/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload size limit
    client_max_body_size 50M;

    # Disable access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # API Proxy
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Routing (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
